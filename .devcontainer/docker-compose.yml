services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        volumes:
            - ..:/workspace:cached
        # Запускаем php-fpm в фоне (-D) и оставляем контейнер живым для VS Code
        command: sh -c "php-fpm -D && sleep infinity"
        depends_on:
            - db
        env_file:
            - app.env

    db:
        image: postgres:16-alpine
        restart: unless-stopped
        volumes:
            - postgres-data:/var/lib/postgresql/data
        env_file:
            - db.env

    pgadmin:
        image: dpage/pgadmin4
        env_file:
            - pgadmin.env
        ports:
            - "8080:80"
        depends_on:
            - db

    nginx:
        image: nginx:alpine
        ports:
            - "80:80"
        volumes:
            - ..:/workspace
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

volumes:
    postgres-data:
